name: Refresh TGJU market prices

on:
  push:
    paths:
      - ".github/workflows/market-rates.yml"
      - "scripts/update_market_rates.py"
  # Avoid the top of the hour, when GitHub scheduled runs are most likely to be delayed.
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgju-market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Scrape TGJU pages
        id: scrape
        continue-on-error: true
        run: python scripts/update_market_rates.py

      - name: Commit updated public snapshot and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-rates.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh TGJU market prices"
          git push

      - name: Fail the run if all sources failed
        if: always() && steps.scrape.outcome == 'failure'
        run: |
          echo "::error::All TGJU market sources failed. The last valid quotes and failure diagnostics were still published."
          exit 1
