name: Security and syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assistant.js
          node --check market-rates.js
          node --input-type=module --check < worker/chat-api.js
          node --input-type=module --check < worker/market-api.js

      - name: Check Python syntax
        run: python -m py_compile scripts/scrape_tgju.py scripts/update_market_rates.py

      - name: Test TGJU parsing and normalization
        run: python -m unittest discover -s tests -v

      - name: Verify strict CSP and no inline code
        run: |
          grep -q "Content-Security-Policy" index.html
          grep -q "script-src 'self'" index.html
          ! grep -Eq '<script[[:space:]]*>' index.html
          ! grep -Eq '<style[[:space:]]*>' index.html
          ! grep -Eiq '[[:space:]]on[a-z]+[[:space:]]*=' index.html
