name: Update market prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape_tgju.py"
      - ".github/workflows/update-market-prices.yml"

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scrape public TGJU pages
        run: python scripts/scrape_tgju.py
      - name: Commit updated public JSON
        run: |
          if ! git diff --quiet -- data/market-rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market-rates.json
            git commit -m "chore: update TGJU market prices"
            git pull --rebase origin main
            git push
          else
            echo "No price changes; nothing to commit."
          fi
