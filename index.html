<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9f6"><title>برنامه‌ریز روزانه</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f9f6;--card:#fff;--soft:#eff5ed;--line:#e3eae0;--ink:#263328;--muted:#899489;--green:#32764a;--green2:#e0efdc;--field:#fcfdfb;--control:#fff;--shadow:0 8px 28px #243c2508}html[data-theme="dark"]{color-scheme:dark;--bg:#111713;--card:#1a221c;--soft:#26352a;--line:#303d33;--ink:#e7eee7;--muted:#9aa99c;--green:#80c995;--green2:#294a32;--field:#161e18;--control:#202a22;--shadow:0 8px 28px #0003}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 "Vazirmatn",Tahoma,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}.wrap{max-width:960px;margin:auto;padding:25px 22px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:800}.logo{background:var(--green);color:white;width:37px;height:37px;border-radius:12px;display:grid;place-items:center}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:-5px}.hint{color:var(--muted);font-size:12px}.intro{margin-bottom:17px}.intro h1{font-size:24px;margin:0 0 3px}.intro p{margin:0;color:var(--muted);font-size:12px}.calendar,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.calhead,.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.month{font-weight:800;font-size:16px}.sub{font-size:10px;color:var(--muted)}.calbuttons{display:flex;gap:5px}.calbuttons button{background:var(--control);border:1px solid var(--line);border-radius:8px;color:var(--ink);height:31px;min-width:31px}.calbuttons .today{padding:0 10px;color:var(--green);font-size:11px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekdays{text-align:center;color:var(--muted);font-size:11px;margin-bottom:5px}.day{border:1px solid transparent;border-radius:9px;background:transparent;min-height:59px;display:flex;flex-direction:column;align-items:center;padding:4px 1px;color:var(--ink)}.day:hover{background:var(--soft)}.day.out{opacity:.35}.day.selected{background:var(--green2);border-color:#b9d8b3}.day.today .p{color:var(--green);font-weight:900}.p{font-size:15px;font-weight:650}.g{font-size:10px;color:var(--muted);line-height:1.5}.dots{height:5px;display:flex;gap:3px;margin-top:3px}.dots i{width:4px;height:4px;background:var(--green);border-radius:50%}.calfoot{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.calfoot strong{color:var(--ink)}.columns{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;margin-top:16px;align-items:start}.panelhead h2{font-size:15px;margin:0}.panelhead p{font-size:10px;color:var(--muted);margin:0}.count{font-size:10px;color:var(--green);background:var(--soft);padding:3px 8px;border-radius:20px;white-space:nowrap}.list{display:grid;gap:7px}.task{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px}.task.done{opacity:.55}.check{appearance:none;width:17px;height:17px;flex:0 0 17px;border:1px solid #bdc9bc;border-radius:5px;margin-top:5px}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';color:#fff;display:block;font-size:11px;text-align:center;line-height:15px}.taskicon{background:var(--soft);border-radius:9px;width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;font-size:17px}.taskbody{flex:1;min-width:0}.tasktitle{font-size:12px;font-weight:800;overflow-wrap:anywhere}.done .tasktitle{text-decoration:line-through}.desc{font-size:11px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;font-size:10px;border-radius:5px;padding:0 6px;margin-top:5px;background:var(--soft);color:var(--muted)}.tag.high{background:#f9eae6;color:#a44b3b}.tag.medium{background:#faf3df;color:#8c6a20}.tag.low{background:var(--green2);color:var(--green)}.actions{display:flex;gap:1px}.actions button{border:0;background:transparent;color:var(--muted);width:25px;height:27px;border-radius:6px}.actions button:hover{background:var(--soft);color:var(--green)}.empty{text-align:center;padding:32px 8px;color:var(--muted);font-size:12px}.empty b{display:block;font-size:23px;color:var(--green);font-weight:400}.form{display:grid;gap:11px}.formpanel[hidden]{display:none}.add-day{display:grid;place-items:center;width:31px;height:31px;border:0;border-radius:9px;background:var(--green);color:#fff;font-size:23px;line-height:1;flex:0 0 auto}.icon-picker{position:relative}.icon-trigger{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:12px}.icon-trigger .chosen{font-size:22px}.icon-menu{position:absolute;z-index:5;top:calc(100% + 5px);right:0;left:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.icon-menu[hidden]{display:none}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.input,.textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 10px;font-size:12px;color:var(--ink)}.textarea{min-height:70px;resize:vertical}.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.emoji{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--control);color:var(--ink);font-size:20px;display:grid;place-items:center}.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}.emoji.active{background:var(--green2);border-color:var(--green)}.priorities{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.prio{border:1px solid var(--line);border-radius:8px;background:var(--control);padding:6px 2px;font-size:11px;color:var(--muted)}.prio.active[data-priority=high]{background:#f9eae6;color:#a44b3b;border-color:#e4b9ae}.prio.active[data-priority=medium]{background:#faf3df;color:#8c6a20;border-color:#e8d7a6}.prio.active[data-priority=low]{background:var(--green2);color:var(--green);border-color:#b9d8b3}.submit{border:0;border-radius:9px;background:var(--green);color:white;font-weight:700;padding:10px;font-size:12px}.cancel{border:0;background:transparent;color:var(--muted);font-size:11px}.formactions{display:flex;gap:8px}.formactions .submit{flex:1}.footnote,.footer{text-align:center;font-size:10px;color:var(--muted);margin-top:12px}.paneltools{display:flex;align-items:center;gap:6px}.filter{border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--control);color:var(--muted);font-size:10px;max-width:100px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,10px);opacity:0;background:#233c2a;color:white;border-radius:9px;padding:8px 14px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.wrap{padding:16px 11px 35px}.hint{display:none}.calendar{padding:12px 8px}.day{min-height:51px}.p{font-size:13px}.g{font-size:9px}.weekdays,.days{gap:2px}.columns{grid-template-columns:1fr}.taskpanel{grid-row:1}.formpanel{grid-row:2}.panel{padding:13px}.intro h1{font-size:21px}.month{font-size:14px}.calfoot{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
html[data-theme="dark"] .tag.high{background:#482a27;color:#f0a99c}html[data-theme="dark"] .tag.medium{background:#403821;color:#e6ce8a}html[data-theme="dark"] .tag.low{background:#294a32;color:#a5dfb4}html[data-theme="dark"] .prio.active[data-priority=high]{background:#482a27;color:#f0a99c;border-color:#75443d}html[data-theme="dark"] .prio.active[data-priority=medium]{background:#403821;color:#e6ce8a;border-color:#66552c}html[data-theme="dark"] .prio.active[data-priority=low]{background:#294a32;color:#a5dfb4;border-color:#3f704b}html[data-theme="dark"] .check{border-color:#66786a}html[data-theme="dark"] .toast{background:#dce9dd;color:#17231a}</style></head>
<body><main class="wrap">
<section class="calendar"><div class="calhead"><div><div class="month" id="monthTitle"></div><div class="sub">تقویم شمسی با معادل میلادی</div></div><div class="calbuttons"><button id="themeToggle" type="button" aria-label="فعال‌کردن تم تاریک" title="تغییر تم"><span class="material-symbols-rounded" id="themeIcon">dark_mode</span></button><button class="today" id="todayBtn">امروز</button><button id="prev" aria-label="ماه قبل">›</button><button id="next" aria-label="ماه بعد">‹</button></div></div>
<div class="weekdays"><span>شنبه</span><span>یکشنبه</span><span>دوشنبه</span><span>سه‌شنبه</span><span>چهارشنبه</span><span>پنجشنبه</span><span>جمعه</span></div><div class="days" id="days"></div>
<div class="calfoot"><span id="selectedDate"></span><span><strong id="dayCount">۰</strong> برنامه در این روز</span></div></section>
<div class="columns">
<section class="panel taskpanel"><div class="panelhead"><div><h2 id="listTitle">برنامه‌های امروز</h2><p>فهرست روز انتخاب‌شده</p></div><div class="paneltools"><span class="count" id="count">۰ برنامه</span><button class="add-day" id="addBtn" type="button" aria-label="افزودن برنامه برای این روز" title="افزودن برنامه">+</button><select id="filter" class="filter" aria-label="فیلتر"><option value="all">همه</option><option value="open">در انتظار</option><option value="done">انجام‌شده</option></select></div></div><div class="list" id="list"></div></section>
<section class="panel formpanel" id="formpanel" hidden><div class="panelhead"><div><h2 id="formTitle">برنامه جدید</h2><p id="formDate"></p></div><span class="count">برنامه</span></div>
<form class="form" id="form"><div><label class="label" for="title">عنوان</label><input class="input" id="title" maxlength="100" placeholder="مثلاً مطالعه ریاضی" required></div>
<div><span class="label">آیکون برنامه</span><div class="icon-picker"><button class="icon-trigger" id="iconTrigger" type="button" aria-expanded="false" aria-controls="emojis"><span class="chosen" id="chosenIcon">📚</span><span>انتخاب آیکون</span><span>⌄</span></button><div class="icon-menu" id="emojis" hidden></div></div></div>
<div><span class="label">اولویت</span><div class="priorities"><button class="prio" type="button" data-priority="low">کم</button><button class="prio active" type="button" data-priority="medium">متوسط</button><button class="prio" type="button" data-priority="high">زیاد</button></div></div>
<div><label class="label" for="description">توضیحات</label><textarea class="textarea" id="description" maxlength="600" placeholder="جزئیات بیشتر (اختیاری)"></textarea></div>
<div class="formactions"><button class="submit" id="submit" type="submit">افزودن برنامه</button><button class="cancel" id="cancel" type="button" hidden>لغو</button></div></form><div class="footnote">اطلاعات در همین مرورگر ذخیره می‌شود.</div></section>
</div></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),STORE='sabzineh.plans.v1',icons=['menu_book','computer','edit_note','track_changes','psychology','directions_run','water_drop','restaurant','palette','music_note','cleaning_services','shopping_cart','work','book','event_note','coffee','spa','star','self_improvement','call','medical_services','flight','lightbulb','favorite','alarm','calendar_month','task_alt','mail','payments','fitness_center','groups','language','code','science','bedtime','sports_esports','account_balance','description','home_repair_service','checklist'];
const fa=n=>new Intl.NumberFormat('fa-IR').format(n),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),from=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},today=()=>iso(new Date());
const pf=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}),pm=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long'}),partsFmt=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}),gf=new Intl.DateTimeFormat('fa-IR-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'}),gd=new Intl.DateTimeFormat('fa-IR-u-ca-gregory',{day:'numeric'});
let plans=[],selected=today(),anchor=from(today()),chosenIcon=icons[0],priority='medium',editing=null,timer;
function parts(d){let o={};partsFmt.formatToParts(d).forEach(p=>{if(p.type!=='literal')o[p.type]=Number(p.value)});return o}
function startMonth(d){let x=new Date(d);for(let i=0;i<32;i++){let prev=add(x,-1),a=parts(x),b=parts(prev);if(a.month!==b.month||a.year!==b.year)return x;x=prev}return x}
function shift(d,n){return startMonth(add(d,n<0?-1:32))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function save(){localStorage.setItem(STORE,JSON.stringify(plans))}
function drawCalendar(){anchor=startMonth(anchor);$('monthTitle').textContent=pm.format(anchor);let start=startMonth(anchor),offset=(start.getDay()+1)%7,first=add(start,-offset),ap=parts(anchor),html='';for(let i=0;i<42;i++){let d=add(first,i),key=iso(d),pp=parts(d),same=pp.month===ap.month&&pp.year===ap.year,dayPlans=plans.filter(t=>t.date===key);html+='<button type="button" class="day '+(!same?'out ':'')+(key===selected?'selected ':'')+(key===today()?'today':'')+'" data-date="'+key+'" aria-label="'+pf.format(d)+' / '+gf.format(d)+'"><span class="p">'+fa(pp.day)+'</span><span class="g">'+fa(d.getDate())+'</span><span class="dots">'+dayPlans.slice(0,3).map(()=>'<i></i>').join('')+'</span></button>'}$('days').innerHTML=html;$('selectedDate').innerHTML='<strong>'+pf.format(from(selected))+'</strong> · '+gf.format(from(selected));$('dayCount').textContent=fa(plans.filter(t=>t.date===selected).length);$('listTitle').textContent=selected===today()?'برنامه‌های امروز':'برنامه‌های '+pf.format(from(selected));$('formDate').textContent=pf.format(from(selected))+' · '+gf.format(from(selected))}
function drawList(){let f=$('filter').value,a=plans.filter(t=>t.date===selected);if(f==='open')a=a.filter(t=>!t.done);if(f==='done')a=a.filter(t=>t.done);a.sort((x,y)=>Number(x.done)-Number(y.done)||({high:0,medium:1,low:2}[x.priority]??1)-({high:0,medium:1,low:2}[y.priority]??1)||x.created-y.created);$('count').textContent=fa(a.length)+' برنامه';$('list').innerHTML=a.length?a.map(t=>'<article class="task '+(t.done?'done':'')+'" data-id="'+esc(t.id)+'"><input class="check" type="checkbox" '+(t.done?'checked':'')+' aria-label="تغییر وضعیت"><div class="taskicon">'+iconHtml(t.icon)+'</div><div class="taskbody"><div class="tasktitle">'+esc(t.title)+'</div>'+(t.description?'<div class="desc">'+esc(t.description)+'</div>':'')+'<span class="tag '+t.priority+'">اولویت '+({high:'زیاد',medium:'متوسط',low:'کم'}[t.priority]||'متوسط')+'</span></div><div class="actions"><button type="button" data-act="edit" aria-label="ویرایش">✎</button><button type="button" data-act="delete" aria-label="حذف">×</button></div></article>').join():'<div class="empty"><b>☘</b>'+(f==='done'?'هنوز برنامه‌ای انجام نشده.':f==='open'?'همه برنامه‌ها انجام شده‌اند.':'برای این روز برنامه‌ای نداری.')+'</div>'}
function render(){drawCalendar();drawList()}
const legacyIcons={'📚':'menu_book','💻':'computer','✍️':'edit_note','🎯':'track_changes','🧠':'psychology','🏃':'directions_run','💧':'water_drop','🍎':'restaurant','🎨':'palette','🎵':'music_note','🧹':'cleaning_services','🛒':'shopping_cart','💼':'work','📖':'book','📝':'event_note','☕':'coffee','🌱':'spa','⭐':'star','🧘':'self_improvement','📞':'call','🩺':'medical_services','✈️':'flight','💡':'lightbulb','❤️':'favorite'};function iconHtml(i){let n=legacyIcons[i]||i;return '<span class="material-symbols-rounded" aria-hidden="true">'+esc(n)+'</span>'}function drawIcons(){$('chosenIcon').innerHTML=iconHtml(chosenIcon);$('emojis').innerHTML=icons.map(i=>'<button type="button" class="emoji '+(i===chosenIcon?'active':'')+'" data-icon="'+i+'" aria-label="'+i.replace(/_/g,' ')+'" title="'+i.replace(/_/g,' ')+'">'+iconHtml(i)+'</button>').join()}
function setPriority(p){priority=p;document.querySelectorAll('[data-priority]').forEach(b=>b.classList.toggle('active',b.dataset.priority===p))}
function closeIconMenu(){$('emojis').hidden=true;$('iconTrigger').setAttribute('aria-expanded','false')}function reset(){editing=null;chosenIcon=icons[0];setPriority('medium');$('form').reset();$('formTitle').textContent='برنامه جدید';$('submit').textContent='افزودن برنامه';$('cancel').hidden=true;$('formpanel').hidden=true;closeIconMenu();drawIcons()}function openForm(){editing=null;$('formpanel').hidden=false;$('formTitle').textContent='برنامه جدید';$('submit').textContent='افزودن برنامه';$('cancel').hidden=true;drawIcons();$('title').focus({preventScroll:true});$('formpanel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function applyTheme(theme){document.documentElement.dataset.theme=theme;$('themeIcon').textContent=theme==='dark'?'light_mode':'dark_mode';$('themeToggle').setAttribute('aria-label',theme==='dark'?'فعال‌کردن تم روشن':'فعال‌کردن تم تاریک');$('themeToggle').title=theme==='dark'?'تم روشن':'تم تاریک';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#111713':'#f7f9f6';try{localStorage.setItem('sabzineh.theme',theme)}catch{}}$('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));let savedTheme='light';try{savedTheme=localStorage.getItem('sabzineh.theme')||'light'}catch{}applyTheme(savedTheme);$('days').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(!b)return;selected=b.dataset.date;anchor=from(selected);reset();render()});
$('prev').addEventListener('click',()=>{anchor=shift(anchor,-1);drawCalendar()});$('next').addEventListener('click',()=>{anchor=shift(anchor,1);drawCalendar()});$('todayBtn').addEventListener('click',()=>{selected=today();anchor=from(today());reset();render()});
$('addBtn').addEventListener('click',openForm);$('iconTrigger').addEventListener('click',()=>{let open=$('emojis').hidden;$('emojis').hidden=!open;$('iconTrigger').setAttribute('aria-expanded',String(open))});$('emojis').addEventListener('click',e=>{let b=e.target.closest('[data-icon]');if(b){chosenIcon=b.dataset.icon;drawIcons();closeIconMenu()}});document.querySelector('.priorities').addEventListener('click',e=>{let b=e.target.closest('[data-priority]');if(b)setPriority(b.dataset.priority)});
$('form').addEventListener('submit',e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;let data={title,icon:chosenIcon,priority,description:$('description').value.trim()};if(editing){plans=plans.map(t=>t.id===editing?{...t,...data}:t);notify('برنامه ویرایش شد')}else{plans.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),date:selected,...data,done:false,created:Date.now()});notify('برنامه اضافه شد')}save();reset();render()});
$('cancel').addEventListener('click',reset);$('filter').addEventListener('change',drawList);
$('list').addEventListener('change',e=>{if(!e.target.matches('.check'))return;let id=e.target.closest('[data-id]').dataset.id;plans=plans.map(t=>t.id===id?{...t,done:e.target.checked}:t);save();render();notify(e.target.checked?'برنامه انجام شد':'برنامه باز شد')});
$('list').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let t=plans.find(x=>x.id===b.closest('[data-id]').dataset.id);if(!t)return;if(b.dataset.act==='delete'){plans=plans.filter(x=>x.id!==t.id);if(editing===t.id)reset();save();render();notify('برنامه حذف شد')}else{editing=t.id;$('formpanel').hidden=false;chosenIcon=legacyIcons[t.icon]||t.icon;setPriority(t.priority);$('title').value=t.title;$('description').value=t.description||'';$('formTitle').textContent='ویرایش برنامه';$('submit').textContent='ذخیره تغییرات';$('cancel').hidden=false;drawIcons();$('title').focus();if(innerWidth<700)$('title').scrollIntoView({behavior:'smooth',block:'center'})}});
try{let x=JSON.parse(localStorage.getItem(STORE)||'[]');plans=Array.isArray(x)?x.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.date==='string'):[]}catch{plans=[]}
anchor=startMonth(from(today()));drawIcons();render();
})();
</script></body></html>
